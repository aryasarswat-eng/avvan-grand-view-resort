<script>
document.addEventListener("DOMContentLoaded", function () {
  const year = document.getElementById("year");
  if (year) {
    year.textContent = new Date().getFullYear();
  }

  const today = new Date();
  const todayString = [
    today.getFullYear(),
    String(today.getMonth() + 1).padStart(2, "0"),
    String(today.getDate()).padStart(2, "0")
  ].join("-");

  const checkin = document.getElementById("checkin");
  const checkout = document.getElementById("checkout");
  const bookingMessage = document.getElementById("bookingMessage");
  const bookingForm = document.getElementById("bookingForm");

  const RESORT_WHATSAPP = "919451535927";

  if (checkin && checkout) {
    checkin.min = todayString;
    checkout.min = todayString;

    checkin.addEventListener("change", function () {
      checkout.min = checkin.value || todayString;

      if (checkout.value && checkout.value <= checkin.value) {
        checkout.value = "";
      }
    });
  }

  if (bookingForm && checkin && checkout && bookingMessage) {
    bookingForm.addEventListener("submit", function (e) {
      e.preventDefault();

      if (!checkin.value || !checkout.value ||
          checkout.value <= checkin.value) {
        bookingMessage.textContent =
          "Please select a valid check-in and check-out date.";
        return;
      }

      const guestElement = document.getElementById("guest");
      const guestsElement = document.getElementById("guests");

      const guest = guestElement ? guestElement.value.trim() : "";
      const guests = guestsElement ? guestsElement.value : "";

      const message =
        "Hello, I would like to enquire about a booking at " +
        "The Avvan Grand View Resort.\n\n" +
        "Guest name: " + guest + "\n" +
        "Check-in: " + checkin.value + "\n" +
        "Check-out: " + checkout.value + "\n" +
        "Number of guests: " + guests + "\n\n" +
        "Please confirm room availability and the total price.";

      const whatsappURL =
        "https://wa.me/" + RESORT_WHATSAPP +
        "?text=" + encodeURIComponent(message);

      bookingMessage.textContent =
        "Opening WhatsApp. Please review and send your enquiry.";

      window.open(whatsappURL, "_blank");
    });
  }
});
</script>
